name: Release

# Builds AutoConnect.app from a clean checkout and attaches it to the GitHub release for the tag.
#
# The build is ad-hoc signed. There is no Developer ID certificate for this project, so the zip
# cannot be notarised, and macOS quarantines anything a browser downloads: the first launch is
# refused until the quarantine flag is cleared. The release notes and the README both say so and
# give the one command that fixes it. Nothing here pretends otherwise.
#
# It is universal on purpose. An arm64-only bundle will not launch on an Intel Mac at all, and
# that failure looks identical to the Gatekeeper one from the outside.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and upload to'
        required: true

permissions:
  contents: write

jobs:
  build:
    # Icon Composer documents (Icons/AppIcon.icon) need actool from Xcode 26 or newer.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Using ${latest}"
          sudo xcode-select -s "${latest}"
          xcodebuild -version
          swift --version

      - name: Resolve the version from the tag
        id: version
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build the app
        env:
          SIGN_IDENTITY: '-'
          REQUIRE_ICON: '1'
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: ./Scripts/make-app.sh

      - name: Verify the bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          app="build/AutoConnect.app"
          plist="${app}/Contents/Info.plist"
          fail=0
          check() {
            if [[ -e "$1" ]]; then
              echo "  ok    $1"
            else
              echo "  MISS  $1"
              fail=1
            fi
          }

          echo "Bundle contents:"
          check "${app}/Contents/MacOS/AutoConnect"
          check "${plist}"
          # The layered macOS 26 icon, the fallback icon for older systems, and the SwiftPM
          # resource bundle that makes the menu bar glyphs resolve outside `swift run`.
          check "${app}/Contents/Resources/Assets.car"
          check "${app}/Contents/Resources/AppIcon.icns"
          check "${app}/Contents/Resources/AutoConnect_AutoConnect.bundle"

          echo "Architectures:"
          # Both slices, or Intel Macs cannot start it and the symptom reads as "it will not open",
          # exactly like the Gatekeeper refusal it is not.
          archs="$(lipo -archs "${app}/Contents/MacOS/AutoConnect")"
          for arch in arm64 x86_64; do
            if [[ " ${archs} " == *" ${arch} "* ]]; then
              echo "  ok    ${arch}"
            else
              echo "  MISS  ${arch} (have: ${archs})"
              fail=1
            fi
          done

          echo "Info.plist keys:"
          for key in CFBundleIconFile CFBundleIconName; do
            value="$(/usr/libexec/PlistBuddy -c "Print :${key}" "${plist}" 2>/dev/null || true)"
            if [[ "${value}" == "AppIcon" ]]; then
              echo "  ok    ${key} = ${value}"
            else
              echo "  BAD   ${key} = ${value:-<missing>} (expected AppIcon)"
              fail=1
            fi
          done

          stamped="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")"
          if [[ "${stamped}" == "${VERSION}" ]]; then
            echo "  ok    CFBundleShortVersionString = ${stamped}"
          else
            echo "  BAD   CFBundleShortVersionString = ${stamped} (expected ${VERSION})"
            fail=1
          fi

          echo "Signature:"
          # Ad-hoc, but it still has to be internally consistent, or the app will not start even
          # after the quarantine flag is cleared.
          codesign --verify --deep --strict --verbose=2 "${app}"

          # Nothing that only makes sense on the machine that built it should reach a download.
          echo "Stray files:"
          strays="$(find "${app}" \( -name '.DS_Store' -o -name '*.swiftmodule' -o -name '*.dSYM' \) -print)"
          if [[ -n "${strays}" ]]; then
            echo "${strays}"
            fail=1
          else
            echo "  none"
          fi

          exit "${fail}"

      - name: Package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="AutoConnect-${VERSION}.zip"
          # Quarantine and other extended attributes belong to the machine that made the file,
          # not to the download. Bundle signatures live in _CodeSignature and inside the Mach-O,
          # so clearing xattrs does not disturb them, and the check below proves it.
          xattr -cr build/AutoConnect.app
          # ditto, not zip: it preserves the bundle structure and the code signature.
          ditto -c -k --sequesterRsrc --keepParent build/AutoConnect.app "${name}"

          # Verify what people actually download, not just what was built.
          unpacked="$(mktemp -d)"
          ditto -x -k "${name}" "${unpacked}"
          app="${unpacked}/AutoConnect.app"
          codesign --verify --deep --strict --verbose=2 "${app}"
          test -f "${app}/Contents/Resources/Assets.car"
          test -f "${app}/Contents/Resources/AppIcon.icns"
          lipo -archs "${app}/Contents/MacOS/AutoConnect"

          echo "name=${name}" >> "$GITHUB_OUTPUT"
          shasum -a 256 "${name}"

      - name: Launch the packaged app with no build directory
        run: |
          set -euo pipefail
          # The check 1.0.0 needed and did not have.
          #
          # Every earlier check asked whether files were present. None asked whether the app could
          # start, and it could not: SwiftPM's generated Bundle.module falls back to an absolute
          # .build path baked in at compile time, so the app resolved its resources only on the
          # machine that built it and trapped in the first MenuBarIcon.load anywhere else. Being
          # menu-bar only, it failed with no window and no dialog, which is why it read as "it
          # does not open" rather than as a crash.
          #
          # So run the copy that came out of the zip, with .build moved away, which is the closest
          # this runner gets to being somebody else's Mac.
          mv .build "$RUNNER_TEMP/build-hidden"

          staging="$(mktemp -d)"
          ditto -x -k "${{ steps.package.outputs.name }}" "${staging}"
          app="${staging}/AutoConnect.app"
          log="$RUNNER_TEMP/launch.log"

          "${app}/Contents/MacOS/AutoConnect" > "${log}" 2>&1 &
          pid=$!

          # Long enough to clear applicationDidFinishLaunching, where the trap happened.
          for _ in $(seq 1 10); do
            sleep 1
            if ! kill -0 "${pid}" 2>/dev/null; then
              wait "${pid}" 2>/dev/null && status=0 || status=$?
              echo "The app died on launch (status ${status}). It would not open for anyone." >&2
              echo "--- output ---" >&2
              cat "${log}" >&2
              mv "$RUNNER_TEMP/build-hidden" .build
              exit 1
            fi
          done

          echo "Still running after 10s with no build directory, so it launches on a clean Mac."
          cat "${log}" || true
          kill "${pid}" 2>/dev/null || true
          wait "${pid}" 2>/dev/null || true
          mv "$RUNNER_TEMP/build-hidden" .build

      - uses: actions/upload-artifact@v4
        with:
          name: AutoConnect-app
          path: ${{ steps.package.outputs.name }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.package.outputs.name }}" --clobber
